<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f4f1ea">
    <title>오프라인 · 오늘감</title>
    <style>
      :root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#1d2520;background:#f4f1ea}
      body{min-height:100vh;margin:0;display:grid;place-items:center}
      main{max-width:320px;padding:32px;text-align:center}
      i{display:block;width:42px;height:42px;margin:0 auto 22px;border:2px solid #183f36;border-radius:50%}
      h1{margin:0;font-size:22px;letter-spacing:-.05em}
      p{color:#657068;font-size:14px;line-height:1.65}
      button{min-height:48px;padding:0 20px;border:0;border-radius:14px;background:#183f36;color:white;font-weight:700}
    </style>
  </head>
  <body><main><i></i><h1>잠시 연결이 끊겼어요.</h1><p>이미 열어본 화면과 기록은 오프라인에서도 사용할 수 있어요. 연결이 돌아오면 자동으로 동기화됩니다.</p><button onclick="location.reload()">다시 확인</button></main></body>
</html>
